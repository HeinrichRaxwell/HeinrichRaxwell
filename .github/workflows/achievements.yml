name: Auto Unlock Achievements

on:
  workflow_dispatch:
    inputs:
      pr_count:
        description: 'Jumlah PR untuk Pull Shark (Rekomendasi: 128 untuk Tier 4 Diamond)'
        required: true
        default: '128'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  unlock-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: ⚡ Unlock Quickdraw (Create & Close Issue < 5s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering Quickdraw..."
          ISSUE_URL=$(gh issue create --title "Quickdraw Achievement Trigger" --body "Closing immediately for achievement")
          gh issue close "$ISSUE_URL" --reason "completed"
          echo "Quickdraw triggered successfully!"

      - name: 🦈 Farm Pull Shark, 🤠 YOLO & 👥 Pair Extraordinaire
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=${{ inputs.pr_count }}
          echo "Starting generation of $COUNT PRs to isolated branch (main remains untouched)..."

          # Buat branch terisolasi agar branch main tetap bersih 100%
          git checkout -B achievements-vault main
          git push origin achievements-vault --force

          for ((i=1; i<=COUNT; i++))
          do
            BRANCH="badge-run-$i"
            git checkout -B "$BRANCH" achievements-vault
            
            # Catat perubahan
            echo "Achievement Step $i: $(date -u)" >> achievements_log.txt
            git add achievements_log.txt
            
            # Commit dengan Co-author (Pair Extraordinaire)
            git commit -m "chore(badge): sync step $i

Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            
            git push origin "$BRANCH" --force
            
            # Buat PR ke achievements-vault (YOLO + Pull Shark)
            PR_URL=$(gh pr create --base achievements-vault --head "$BRANCH" --title "Achievement Sync PR #$i" --body "Automated achievement step $i")
            
            # Merge PR langsung tanpa review
            gh pr merge "$PR_URL" --merge --delete-branch
            
            echo "Completed PR #$i / $COUNT"
            
            # Update local base branch
            git checkout achievements-vault
            git pull origin achievements-vault
          done

          echo "All $COUNT PRs created and merged successfully!"
